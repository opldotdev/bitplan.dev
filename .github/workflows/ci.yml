name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      - name: Smoke-test packed CLI
        working-directory: packages/cli
        run: |
          pack_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          npm pack --silent --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -name 'bitplan-*.tgz' -print -quit)"
          test -n "$tarball"
          npm install --prefix "$smoke_dir" "$tarball"
          node "$smoke_dir/node_modules/.bin/bitplan" version
          node "$smoke_dir/node_modules/.bin/bitplan" --help
