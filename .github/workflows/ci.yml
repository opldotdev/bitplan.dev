name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      - name: Smoke-test packed CLI
        working-directory: packages/cli
        run: |
          tarball="$(npm pack --silent)"
          smoke_dir="$(mktemp -d)"
          npm install --prefix "$smoke_dir" "./$tarball"
          node "$smoke_dir/node_modules/.bin/bitplan" version
          node "$smoke_dir/node_modules/.bin/bitplan" --help
